# Netlify front door: gives the site a readable address (e.g. https://smart-campus-s.netlify.app) on Netlify's free
# plan. Netlify builds nothing and stores no data; it forwards every request, unchanged, to the AWS site.
# Register the address with Cognito once: python infra/deploy.py ... --alias-url https://smart-campus-s.netlify.app
# If the AWS address changes (e.g. after switching to CloudFront), update "to" below.

[build]
  publish = "edge/netlify"
  command = "echo 'nothing to build: requests are forwarded to AWS'"

[[redirects]]
  from = "/*"
  to = "https://4opguph3u4r34vcuvos4b5elga0zmgse.lambda-url.eu-west-2.on.aws/:splat"
  status = 200
  force = true
