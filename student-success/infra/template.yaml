AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Smart Campus student success analytics. CloudFront (default domain) in front of two IAM-protected
  Lambda Function URLs (web app and API) signed with Origin Access Control; DynamoDB provisioned capacity;
  Cognito user pool with admin-provisioned accounts. Sized to stay within AWS always-free allowances;
  see docs/aws-cost-and-preflight.md before deploying. No EC2, NAT, load balancer, API Gateway,
  provisioned concurrency, SMS, custom domain or paid monitoring.

Parameters:
  AppName:
    Type: String
    Default: smartcampus
    AllowedPattern: "^[a-z][a-z0-9-]{2,20}$"
    Description: Prefix for resource names (lowercase).
  SiteUrl:
    Type: String
    Default: ""
    AllowedPattern: "^(|https://[a-z0-9.-]+\\.cloudfront\\.net|https://[a-z0-9]+\\.lambda-url\\.[a-z0-9-]+\\.on\\.aws)$"
    Description: >-
      The CloudFront URL (https://dxxxx.cloudfront.net). Empty on the very first deploy; the deploy script
      fills it in from the stack output and updates the stack so sign-in redirects can be registered.
  AliasUrl:
    Type: String
    Default: ""
    AllowedPattern: "^$|^https://[a-z0-9.-]+$"
    Description: >-
      Optional second address that forwards to this site (e.g. https://smart-campus.netlify.app). It is registered
      for sign-in and sign-out alongside SiteUrl, so users can use either address.
  AuthDomainPrefix:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
    Description: >-
      Prefix of the sign-in address https://<prefix>.auth.<region>.amazoncognito.com (free; must be unused in the
      region). Empty = "<AppName>-<AccountId>". Changing it replaces the domain; sign-in briefly fails until it's ready.
  EdgeMode:
    Type: String
    Default: cloudfront
    AllowedValues: [cloudfront, direct]
    Description: >-
      cloudfront (the designed architecture): CloudFront with OAC in front of two IAM-protected function URLs.
      direct (temporary, e.g. while an account awaits CloudFront verification): one public function URL serves
      both the app and the API; every data request still requires a Cognito token, but there is no edge layer.
  TableReadCapacity:
    Type: Number
    Default: 8
    MinValue: 1
    MaxValue: 25
    Description: Table RCU (fixed; no autoscaling).
  TableWriteCapacity:
    Type: Number
    Default: 8
    MinValue: 1
    MaxValue: 25
    Description: Table WCU (fixed; no autoscaling).
  GsiReadCapacity:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 10
    Description: RCU for each of the two global secondary indexes.
  GsiWriteCapacity:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 10
    Description: WCU for each of the two global secondary indexes.
  ApiReservedConcurrency:
    Type: Number
    Default: 5
    MinValue: 0
    MaxValue: 50
    Description: Reserved concurrency cap for the API function (0 = no reservation; see preflight).
  WebReservedConcurrency:
    Type: Number
    Default: 2
    MinValue: 0
    MaxValue: 20
    Description: Reserved concurrency cap for the web function (0 = no reservation).
  LogRetentionDays:
    Type: Number
    Default: 3
    AllowedValues: [1, 3, 5, 7]
    Description: CloudWatch Logs retention (short to stay within the free 5 GB of log data).
  UserPoolTier:
    Type: String
    Default: LITE
    AllowedValues: [LITE, ESSENTIALS]
    Description: >-
      Cognito feature plan. Both include 10,000 free monthly active users (verify). If LITE is not offered
      to new user pools in your account, use ESSENTIALS. Never PLUS (no free tier).
  BudgetEmail:
    Type: String
    Default: ""
    Description: Optional email for a USD 1 monthly cost budget alert (empty = no budget).
  TableDeletionProtection:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  UserPoolDeletionProtection:
    Type: String
    Default: ACTIVE
    AllowedValues: [ACTIVE, INACTIVE]
    Description: Teardown switches this off before deleting the stack.

Conditions:
  HasSiteUrl: !Not [!Equals [!Ref SiteUrl, ""]]
  HasAliasUrl: !And [!Condition HasSiteUrl, !Not [!Equals [!Ref AliasUrl, ""]]]
  HasAuthDomainPrefix: !Not [!Equals [!Ref AuthDomainPrefix, ""]]
  UseCloudFront: !Equals [!Ref EdgeMode, cloudfront]
  Direct: !Equals [!Ref EdgeMode, direct]
  HasBudget: !Not [!Equals [!Ref BudgetEmail, ""]]
  ReserveApi: !Not [!Equals [!Ref ApiReservedConcurrency, 0]]
  ReserveWeb: !Not [!Equals [!Ref WebReservedConcurrency, 0]]

Resources:
  # ------------------------------------------------------------------ data
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete          # guarded by DeletionProtectionEnabled; teardown switches it off after an optional export
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AppName}-data"
      TableClass: STANDARD
      BillingMode: PROVISIONED
      DeletionProtectionEnabled: !Ref TableDeletionProtection
      ProvisionedThroughput:
        ReadCapacityUnits: !Ref TableReadCapacity
        WriteCapacityUnits: !Ref TableWriteCapacity
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
        - { AttributeName: gsi2pk, AttributeType: S }
        - { AttributeName: gsi2sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
          ProvisionedThroughput:
            ReadCapacityUnits: !Ref GsiReadCapacity
            WriteCapacityUnits: !Ref GsiWriteCapacity
        - IndexName: gsi2
          KeySchema:
            - { AttributeName: gsi2pk, KeyType: HASH }
            - { AttributeName: gsi2sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
          ProvisionedThroughput:
            ReadCapacityUnits: !Ref GsiReadCapacity
            WriteCapacityUnits: !Ref GsiWriteCapacity
      # Point-in-time recovery and on-demand backups are paid features: off by default (see docs/deployment.md).
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      Tags:
        - { Key: app, Value: !Ref AppName }

  # ------------------------------------------------------------------ identity
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AppName}-users"
      UserPoolTier: !Ref UserPoolTier
      DeletionProtection: !Ref UserPoolDeletionProtection
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true      # no open sign-up: students register only by matching their record (app/registration.py)
      UsernameConfiguration:
        CaseSensitive: false
      AutoVerifiedAttributes: [email]
      VerificationMessageTemplate:          # 6-digit codes for registration (app/registration.py) and password recovery (app/recovery.py)
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: "Your Smart Campus verification code"
        EmailMessage: "Your Smart Campus verification code is {####}<br><br>Enter this 6-digit code on the Smart Campus page where you asked for it (create account or reset password). If you did not ask for it, ignore this email and your account stays unchanged."
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: verified_email, Priority: 1 }   # never SMS
      MfaConfiguration: "OPTIONAL"
      EnabledMfas: [SOFTWARE_TOKEN_MFA]             # TOTP apps only; no SMS
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT        # free default sender (low daily limit; see docs)
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 3
      Schema:
        - { Name: email, AttributeDataType: String, Required: false, Mutable: true }
        - { Name: name, AttributeDataType: String, Required: false, Mutable: true }

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !If [HasAuthDomainPrefix, !Ref AuthDomainPrefix, !Sub "${AppName}-${AWS::AccountId}"]
      UserPoolId: !Ref UserPool
      ManagedLoginVersion: 1        # classic hosted UI

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AppName}-spa"
      UserPoolId: !Ref UserPool
      GenerateSecret: false                          # public client; PKCE
      # ADMIN_USER_PASSWORD_AUTH needs AWS credentials (the API role); the backend uses it only for the short-lived
      # registration placeholder that receives and checks the email code. Browsers keep using SRP / the hosted UI.
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH, ALLOW_USER_SRP_AUTH, ALLOW_ADMIN_USER_PASSWORD_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      SupportedIdentityProviders: [COGNITO]
      AllowedOAuthFlowsUserPoolClient: !If [HasSiteUrl, true, false]
      AllowedOAuthFlows: !If [HasSiteUrl, [code], !Ref AWS::NoValue]
      # aws.cognito.signin.user.admin lets a signed-in user register their own authenticator app (TOTP)
      AllowedOAuthScopes: !If [HasSiteUrl, [openid, email, profile, aws.cognito.signin.user.admin], !Ref AWS::NoValue]
      CallbackURLs: !If [HasAliasUrl, [!Sub "${SiteUrl}/", !Sub "${AliasUrl}/"], !If [HasSiteUrl, [!Sub "${SiteUrl}/"], !Ref AWS::NoValue]]
      LogoutURLs: !If [HasAliasUrl, [!Sub "${SiteUrl}/", !Sub "${AliasUrl}/"], !If [HasSiteUrl, [!Sub "${SiteUrl}/"], !Ref AWS::NoValue]]
      IdTokenValidity: 60
      AccessTokenValidity: 60
      RefreshTokenValidity: 12
      TokenValidityUnits: { IdToken: minutes, AccessToken: minutes, RefreshToken: hours }
      ReadAttributes: [email, name]
      WriteAttributes: [name]                        # users can't change their email or anything security-relevant

  # ------------------------------------------------------------------ compute
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AppName}-api"
      RetentionInDays: !Ref LogRetentionDays

  WebLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: UseCloudFront
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AppName}-web"
      RetentionInDays: !Ref LogRetentionDays

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: api
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${ApiLogGroup.Arn}:*"
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:ConditionCheckItem
                Resource:
                  - !GetAtt Table.Arn
                  - !Sub "${Table.Arn}/index/*"
              - Effect: Allow
                Action:
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminDeleteUser
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminSetUserPassword
                  - cognito-idp:AdminInitiateAuth
                  - cognito-idp:AdminSetUserMFAPreference
                  - cognito-idp:AdminResetUserPassword
                  - cognito-idp:AdminDisableUser
                  - cognito-idp:AdminEnableUser
                  - cognito-idp:AdminUserGlobalSignOut
                Resource: !GetAtt UserPool.Arn

  WebRole:
    Type: AWS::IAM::Role
    Condition: UseCloudFront
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: web
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${WebLogGroup.Arn}:*"

  # Code is uploaded directly as a ZIP by infra/deploy.py (no S3 bucket). The inline placeholder only
  # answers until the first upload.
  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AppName}-api"
      Runtime: python3.12
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 512
      Timeout: 20                    # imports and repairs work within ~12 s budgets and resume
      ReservedConcurrentExecutions: !If [ReserveApi, !Ref ApiReservedConcurrency, !Ref AWS::NoValue]
      Role: !GetAtt ApiRole.Arn
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
        LogFormat: Text
      Environment:
        Variables:
          AUTH_MODE: cognito          # local demo sign-in is refused inside Lambda
          STORAGE: dynamodb
          TABLE_NAME: !Ref Table
          COGNITO_USER_POOL_ID: !Ref UserPool
          COGNITO_CLIENT_ID: !Ref UserPoolClient
          VERIFY_PAYLOAD_HASH: "1"
          SSP_CONFIG_DIR: /var/task/config
          INSIGHT_CACHE_SECONDS: "20"
          SERVE_WEB: !If [Direct, "1", "0"]   # direct mode: this function also serves the web app
          WEB_ROOT: /var/task/web
          APP_CONFIG: !Sub
            - '{"mode":"cognito","domain":"https://${Domain}.auth.${AWS::Region}.amazoncognito.com","clientId":"${UserPoolClient}","redirectUri":"${Redirect}","region":"${AWS::Region}"}'
            - Domain: !Ref UserPoolDomain
              Redirect: !If [HasSiteUrl, !Sub "${SiteUrl}/", ""]
      Code:
        ZipFile: |
          def handler(event, context):
              return {"statusCode": 503, "headers": {"content-type": "text/plain"}, "body": "Not deployed yet"}

  WebFunction:
    Type: AWS::Lambda::Function
    Condition: UseCloudFront
    Properties:
      FunctionName: !Sub "${AppName}-web"
      Runtime: python3.12
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 128
      Timeout: 5
      ReservedConcurrentExecutions: !If [ReserveWeb, !Ref WebReservedConcurrency, !Ref AWS::NoValue]
      Role: !GetAtt WebRole.Arn
      LoggingConfig:
        LogGroup: !Ref WebLogGroup
        LogFormat: Text
      Environment:
        Variables:
          WEB_ROOT: /var/task/web
          APP_CONFIG: !Sub
            - '{"mode":"cognito","domain":"https://${Domain}.auth.${AWS::Region}.amazoncognito.com","clientId":"${UserPoolClient}","redirectUri":"${Redirect}","region":"${AWS::Region}"}'
            - Domain: !Ref UserPoolDomain
              Redirect: !If [HasSiteUrl, !Sub "${SiteUrl}/", ""]
      Code:
        ZipFile: |
          def handler(event, context):
              return {"statusCode": 503, "headers": {"content-type": "text/plain"}, "body": "Not deployed yet"}

  ApiUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt ApiFunction.Arn
      AuthType: !If [UseCloudFront, AWS_IAM, NONE]   # cloudfront: only the distribution (OAC) may call it
      InvokeMode: BUFFERED

  WebUrl:
    Type: AWS::Lambda::Url
    Condition: UseCloudFront
    Properties:
      TargetFunctionArn: !GetAtt WebFunction.Arn
      AuthType: AWS_IAM
      InvokeMode: BUFFERED

  # CloudFront OAC needs both permissions, each restricted to this distribution.
  ApiUrlPermission:
    Type: AWS::Lambda::Permission
    Condition: UseCloudFront
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunctionUrl
      Principal: cloudfront.amazonaws.com
      FunctionUrlAuthType: AWS_IAM
      SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: UseCloudFront
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: cloudfront.amazonaws.com
      InvokedViaFunctionUrl: true
      SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  WebUrlPermission:
    Type: AWS::Lambda::Permission
    Condition: UseCloudFront
    Properties:
      FunctionName: !Ref WebFunction
      Action: lambda:InvokeFunctionUrl
      Principal: cloudfront.amazonaws.com
      FunctionUrlAuthType: AWS_IAM
      SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  WebInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: UseCloudFront
    Properties:
      FunctionName: !Ref WebFunction
      Action: lambda:InvokeFunction
      Principal: cloudfront.amazonaws.com
      InvokedViaFunctionUrl: true
      SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # Direct mode only: the function URL is public; the app itself requires a Cognito token for all data.
  ApiPublicUrlPermission:
    Type: AWS::Lambda::Permission
    Condition: Direct
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  ApiPublicInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: Direct
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # ------------------------------------------------------------------ edge
  LambdaOac:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: UseCloudFront
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AppName}-lambda-oac"
        Description: Signs requests to the IAM-protected Lambda function URLs
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

  ApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Condition: UseCloudFront
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "${AppName}-api-forward"
        Comment: App token travels separately from the OAC SigV4 Authorization header
        HeadersConfig:
          HeaderBehavior: whitelist
          # x-amz-content-sha256 is not listed: CloudFront treats it as restricted and uses the viewer's value when
          # OAC signs the request, so a body that doesn't match its hash is rejected by Lambda.
          Headers: [x-app-authorization, content-type, accept]
        QueryStringsConfig: { QueryStringBehavior: all }
        CookiesConfig: { CookieBehavior: none }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Condition: UseCloudFront
    Properties:
      DistributionConfig:
        Comment: !Sub "${AppName} student success analytics"
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        # Default *.cloudfront.net domain and certificate: no custom domain, no certificate cost.
        ViewerCertificate: { CloudFrontDefaultCertificate: true }
        Origins:
          - Id: web
            DomainName: !Select [2, !Split ["/", !GetAtt WebUrl.FunctionUrl]]
            OriginAccessControlId: !GetAtt LambdaOac.Id
            CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2] }
          - Id: api
            DomainName: !Select [2, !Split ["/", !GetAtt ApiUrl.FunctionUrl]]
            OriginAccessControlId: !GetAtt LambdaOac.Id
            CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2], OriginReadTimeout: 30 }
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6     # Managed-CachingOptimized (honours origin Cache-Control)
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad   # Managed-CachingDisabled: API responses are never cached
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
          - PathPattern: /config.json
            TargetOriginId: web
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad

  # ------------------------------------------------------------------ cost guard (optional, email only)
  CostBudget:
    Type: AWS::Budgets::Budget
    Condition: HasBudget
    Properties:
      Budget:
        BudgetName: !Sub "${AppName}-zero-spend"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: 1, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 1, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]

Outputs:
  SiteUrl:
    Description: Open this address. Re-deploy with SiteUrl set to it (deploy.py does this automatically).
    Value: !If
      - UseCloudFront
      - !Sub "https://${Distribution.DomainName}"
      - !Join ["", ["https://", !Select [2, !Split ["/", !GetAtt ApiUrl.FunctionUrl]]]]
  EdgeMode:
    Value: !Ref EdgeMode
  DistributionId:
    Condition: UseCloudFront
    Value: !Ref Distribution
  TableName:
    Value: !Ref Table
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  AliasUrl:
    Condition: HasAliasUrl
    Value: !Ref AliasUrl
  CognitoDomain:
    Value: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
  ApiFunctionName:
    Value: !Ref ApiFunction
  WebFunctionName:
    Condition: UseCloudFront
    Value: !Ref WebFunction
  ApiFunctionUrl:
    Description: In cloudfront mode direct calls must be refused (403); in direct mode this is the site.
    Value: !GetAtt ApiUrl.FunctionUrl
